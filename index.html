<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3f86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mera Hisaab</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="hisaab-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#eef5f8;--card:#fff;--tx:#122338;--mu:#5f7388;--ac:#2b7bb9;--ac2:#1f5f96;--in:#1fa27a;--out:#e8643a;--rem:#2f7fd0;--ud:#e8a21c;--bd:#dbe7ee;--sh:0 2px 10px rgba(31,63,134,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1628;--card:#13233f;--tx:#e6f0f8;--mu:#8aa3bb;--ac:#5db4dc;--ac2:#3e97c4;--in:#3ccf9b;--out:#ff7a55;--rem:#74b0ff;--ud:#f5b94a;--bd:#21365a;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:0 14px}
header{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 0 8px}
header h1{font-size:20px;margin:0;flex:1}
.ib{border:0;background:var(--card);color:var(--tx);width:38px;height:38px;border-radius:12px;box-shadow:var(--sh);font-size:18px;cursor:pointer}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh);margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .card{margin:0}
.lab{color:var(--mu);font-size:12px}
.big{font-size:20px;font-weight:700;margin-top:2px;word-break:break-word}
.in{color:var(--in)}.out{color:var(--out)}.rem{color:var(--rem)}.ud{color:var(--ud)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.mnav b{font-size:16px}
.mnav button{border:0;background:var(--card);color:var(--tx);width:38px;height:34px;border-radius:10px;font-size:16px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.row:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--bg);flex:none}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{text-align:right;flex:none}
.ra b{display:block}.ra small{color:var(--mu)}
.dh{font-size:12px;color:var(--mu);margin:12px 2px 2px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:19px}
nav button.on{color:var(--ac);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.bar.warn i{background:var(--out)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mu)}
.pill.bad{background:rgba(229,72,77,.15);color:var(--out)}
.btn{border:0;background:var(--ac);color:#fff;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn.dan{background:var(--out)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.ban{background:rgba(232,137,12,.14);color:var(--tx);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px;border:1px solid rgba(232,137,12,.35)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 8px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;outline:none}
input:focus{border-color:var(--ac)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.amt{display:flex;gap:8px}
.amt input{font-size:24px;font-weight:700}
.amt button{flex:none;width:96px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:16px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:6px;border:1px solid var(--bd)}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px 2px;border-radius:9px;font-size:13px;font-weight:600}
.seg button.on{background:var(--ac);color:#fff}
.hint{font-size:12px;color:var(--mu);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-size:14px;max-width:90%;text-align:center}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--bd)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--mu);font-weight:600}
svg text{fill:var(--mu);font-size:9px}
.cl{max-height:50vh;overflow:auto;margin-top:8px}
h3{font-size:14px;margin:0 0 6px}
.sp{display:flex;justify-content:space-between;gap:8px;padding:5px 0}
.lock{position:fixed;inset:0;background:var(--bg);color:var(--tx);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.dots{display:flex;gap:12px;margin:18px 0 22px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ac)}.dots i.on{background:var(--ac)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}.pad button{height:72px;border-radius:50%;border:0;background:var(--card);color:var(--tx);font-size:26px;font-weight:600;box-shadow:var(--sh);cursor:pointer}.pad span{display:block}
/* ===== icon wala design ===== */
:root{--g:linear-gradient(135deg,#1f3f86,#2f7fb8 58%,#4cc3c0)}
@media(prefers-color-scheme:dark){:root{--g:linear-gradient(135deg,#102a5c,#1d5f95 58%,#2a9c9a)}}
html{background:var(--bg)}
body{position:relative;background:transparent}
body::before{content:"";position:absolute;top:0;left:0;right:0;height:calc(160px + env(safe-area-inset-top));background:var(--g);border-radius:0 0 30px 30px;z-index:-1;transition:height .3s}
body.hm::before{height:calc(268px + env(safe-area-inset-top))}
header h1{color:#fff;font-size:21px;letter-spacing:.2px}
header .lg{width:34px;height:34px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
header .ib{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.mnav b{color:#fff}
.mnav button{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.card{border-radius:18px;border:1px solid var(--bd)}
.ico{background:linear-gradient(135deg,rgba(47,127,184,.13),rgba(76,195,192,.2))}
.hero{background:var(--g);border:1px solid rgba(255,255,255,.3);box-shadow:0 8px 24px rgba(31,63,134,.3);color:#fff;border-radius:22px;padding:16px 16px 14px;margin:10px 0}
.hero .hl{font-size:13px;opacity:.85}
.hero .hbig{font-size:32px;font-weight:800;margin:2px 0 12px;word-break:break-word}
.hero.neg .hbig{color:#ffd3c4}
.hrow{display:flex;gap:8px}
.hrow>div{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:8px 10px;min-width:0}
.hrow small{display:block;font-size:11px;opacity:.85;white-space:nowrap}
.hrow b{display:block;font-size:14px;margin-top:2px;word-break:break-word}
.btn,.fab{background:var(--g)}
.btn.sec{background:var(--bg)}
.seg button.on,.chip.on{background:var(--g);border-color:transparent}
.bar i{background:linear-gradient(90deg,var(--ac),#4cc3c0)}
.fab{box-shadow:0 6px 18px rgba(31,63,134,.45)}
nav{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:color-mix(in srgb,var(--card) 88%,transparent)}
nav button span{transition:background .2s;border-radius:14px;padding:1px 16px}
nav button.on span{background:rgba(47,127,184,.16)}
.lock{background:var(--g);color:#fff}
.lock h2{color:#fff}
.lock .hint,.lock a{color:rgba(255,255,255,.85)!important}
.pad button{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.dots i{border-color:#fff}.dots i.on{background:#fff}

.ban{background:color-mix(in srgb,var(--card) 84%,#e8a21c 16%)}

.mb{display:flex;align-items:flex-end;gap:6px;height:96px;margin:6px 0}
.mc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;cursor:pointer;height:100%}
.mc i{display:block;width:100%;max-width:22px;border-radius:6px 6px 3px 3px;background:rgba(47,127,184,.3);transition:height .4s}
.mc i.on{background:var(--g)}
.mc small{font-size:10px;color:var(--mu)}
nav button{font-size:10.5px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes fd{from{opacity:0}}
@keyframes sl{from{transform:translateY(40px);opacity:.5}}
#main>*{animation:up .3s ease both}
#main>*:nth-child(2){animation-delay:.04s}#main>*:nth-child(3){animation-delay:.08s}#main>*:nth-child(4){animation-delay:.12s}#main>*:nth-child(5){animation-delay:.16s}
.bar i{animation:grow .6s cubic-bezier(.2,.8,.2,1)}
.ov{animation:fd .2s}.sheet{animation:sl .25s ease-out}.toast{animation:fd .2s}
.btn,.fab,.chip,.ib,.pad button,nav button{transition:transform .12s}
.btn:active,.fab:active,.chip:active,.ib:active,.pad button:active{transform:scale(.95)}
.row:active{background:rgba(47,127,184,.08)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><header><img class="lg" src="hisaab-192.png" alt=""><h1 id="ttl" data-a="accts" style="cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Mera Hisaab</h1><button class="ib" data-a="setg" aria-label="Settings">⚙️</button></header><div id="main"></div></div>
<button class="fab" data-a="add" aria-label="Naya">+</button>
<nav><div id="nav"></div></nav>
<div id="ovs"></div>
<script>
'use strict';
const AK='hs_accts_v1';
const kS=id=>id==='main'?'hs_data_v1':'hs_data_v1_'+id,kL=id=>id==='main'?'hs_lock_v1':'hs_lock_v1_'+id,kF=id=>id==='main'?'hs_lockfail':'hs_lockfail_'+id;
function readAccts(){try{const j=JSON.parse(localStorage.getItem(AK));if(j&&Array.isArray(j.list)&&j.list.length){if(!j.list.some(a=>a.id===j.cur))j.cur=j.list[0].id;return j}}catch(e){}return{cur:'main',list:[{id:'main',name:'Mera Hisaab'}]}}
let AC=readAccts();
const saveAC=()=>{try{localStorage.setItem(AK,JSON.stringify(AC))}catch(e){}};
const curAcct=()=>AC.list.find(a=>a.id===AC.cur)||AC.list[0];
const LS=kS(AC.cur);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FALLBACK={USD:1,SAR:3.75,INR:88,AED:3.6725,PKR:280,BDT:122,EUR:.92,GBP:.78,KWD:.307,QAR:3.64,OMR:.385,BHD:.376,JOD:.709,EGP:48,TRY:41,MYR:4.2,IDR:16500,PHP:57,NPR:140,LKR:300,CAD:1.38,AUD:1.52,CNY:7.15,JPY:150,SGD:1.3,ZAR:18,NGN:1500,RUB:90,CHF:.85,KRW:1400,THB:34,MAD:9.5,DZD:135,TND:3.1,LBP:89500,IQD:1310,YER:250,SDG:600,ETB:120,KES:129,UGX:3700,TZS:2500,AFN:70,MVR:15.4,BRL:5.4,MXN:19,NZD:1.65,SEK:10.5,NOK:10.8,DKK:6.9,PLN:3.9,HKD:7.8};
const CATS_OUT=[['khana','🍽️','Khana'],['kiraya','🏠','Kiraya'],['net','📱','Mobile/Net'],['safar','🚕','Safar'],['kapde','👕','Kapde'],['sehat','💊','Sehat'],['taleem','📚','Taleem'],['sadqa','🤲','Sadqa/Zakat'],['tohfa','🎁','Tohfa'],['samaan','🛒','Samaan'],['bill','🧾','Bill'],['anya','➕','Anya']];
const CATS_IN=[['tankhwah','💼','Tankhwah'],['business','🏪','Business'],['tohfa','🎁','Tohfa mila'],['anya','➕','Anya']];
const UDK=[['diya','➡️','Maine diya',1],['liya','⬅️','Maine liya',-1],['wapas_mila','↩️','Wapas mila',-1],['wapas_diya','↪️','Maine wapas diya',1]];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const R3=x=>Math.round(x*1000)/1000;

/* ---------- state ---------- */
function fresh(){return{v:1,base:'INR',recent:['SAR','INR','USD'],entries:[],fx:{r:{},t:0,src:''},budget:0,cb:{},rec:[],goal:0,lastBackup:0,created:Date.now()}}
let S=load();
function load(){try{const j=JSON.parse(localStorage.getItem(LS));if(j&&j.v&&Array.isArray(j.entries))return Object.assign(fresh(),j)}catch(e){}return fresh()}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Save nahi hua! Phone ki jagah check karo, aur backup lo.')}}
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const UI={tab:'home',m:today().slice(0,7),y:+today().slice(0,4),f:'all',q:''};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- money helpers ---------- */
function num(s){if(typeof s==='number')return isFinite(s)?s:0;s=String(s||'').trim().replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/٫/g,'.').replace(/٬/g,'');if(/^\d+,\d{1,2}$/.test(s))s=s.replace(',','.');s=s.replace(/,/g,'');const n=parseFloat(s);return isFinite(n)?n:0}
const rate=c=>S.fx.r[c]||FALLBACK[c]||0;
const xrate=(a,b)=>{const ra=rate(a),rb=rate(b);return ra&&rb?rb/ra:0};
const nfc={};
function nf(c){if(nfc[c])return nfc[c];let d=2;try{d=new Intl.NumberFormat('en-US',{style:'currency',currency:c}).resolvedOptions().maximumFractionDigits}catch(e){}
 return nfc[c]=new Intl.NumberFormat(c==='INR'?'en-IN':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
const fmt=(a,c)=>nf(c).format(a)+' '+c;
const fmtN=(a,c)=>nf(c).format(a);
function bv(e){if(e.c===S.base)return e.a;if(e.b===S.base&&e.r)return e.a*e.r;const rb=rate(S.base);return e.u&&rb?e.a*e.u*rb:0}
let DN=null;
function cname(c){try{DN=DN||new Intl.DisplayNames(['en'],{type:'currency'});return DN.of(c)||c}catch(e){return c}}
function allCurs(){const set=new Set([...Object.keys(FALLBACK),...Object.keys(S.fx.r)]);const out=[];set.forEach(c=>{if(/^[A-Z]{3}$/.test(c)){try{new Intl.NumberFormat('en-US',{style:'currency',currency:c});out.push(c)}catch(e){}}});return out.sort()}
function bumpRecent(c){S.recent=[c,...S.recent.filter(x=>x!==c)].slice(0,8)}

/* ---------- rates ---------- */
async function fetchJ(u){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),9000);try{const r=await fetch(u,{cache:'no-store',signal:ac.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}}
async function refreshRates(manual){
 try{const j=await fetchJ('https://open.er-api.com/v6/latest/USD');if(j&&j.rates&&j.rates.INR){S.fx={r:j.rates,t:Date.now(),src:'open.er-api.com'};save();if(manual)toast('Rate update ho gaye ✔');render();return true}}catch(e){}
 try{const j=await fetchJ('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');if(j&&j.usd){const r={};Object.keys(j.usd).forEach(k=>{if(/^[a-z]{3}$/.test(k)&&j.usd[k]>0)r[k.toUpperCase()]=j.usd[k]});if(r.INR){S.fx={r,t:Date.now(),src:'currency-api'};save();if(manual)toast('Rate update ho gaye ✔');render();return true}}}catch(e){}
 if(manual)toast('Rate nahi mile. Internet check karo; purane rate chalte rahenge.');return false}
const rateAge=()=>S.fx.t?Math.floor((Date.now()-S.fx.t)/36e5):null;

/* ---------- data helpers ---------- */
const sorted=()=>S.entries.slice().sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(a.id<b.id?1:-1));
function catInfo(e){const l=e.t==='in'?CATS_IN:CATS_OUT;return l.find(x=>x[0]===e.cat)||['','❔','Anya']}
function mSum(m){const s={inc:0,out:0,rem:0,cats:{},n:0};S.entries.forEach(e=>{if(!e.d.startsWith(m))return;const v=bv(e);if(e.t==='in'){s.inc+=v;s.n++}else if(e.t==='out'){s.out+=v;s.cats[e.cat]=(s.cats[e.cat]||0)+v;s.n++}else if(e.t==='rem'){s.rem+=v;s.n++}});return s}
function cbStatus(s){const out=[];Object.entries(S.cb||{}).forEach(([k,lim])=>{if(!(lim>0))return;const v=s.cats[k]||0;out.push({k,lim,v,p:v/lim*100})});return out.sort((a,b)=>b.p-a.p)}
/* ---------- data / 5 saal ---------- */
function cutoff5(){const d=new Date();d.setFullYear(d.getFullYear()-5);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function dataInfo(){let old='';S.entries.forEach(e=>{if(!old||e.d<old)old=e.d});
 const chars=JSON.stringify(S).length,cut=cutoff5();
 return{n:S.entries.length,old,kb:Math.round(chars/1024),pct:Math.min(100,Math.round(chars/5e6*100)),cut,prune:S.entries.filter(e=>e.t!=='ud'&&e.d<cut)}}
/* ---------- recurring (har mahine) ---------- */
const pad2=n=>String(n).padStart(2,'0');
function processRec(){let ch=false;const td=today(),cur=td.slice(0,7);
 (S.rec||[]).forEach(r=>{let m=r.last?shiftM(r.last,1):r.from,n=0;
  while(m<=cur&&n++<120){const d=m+'-'+pad2(r.day);if(d>td)break;
   const x=r.c===S.base?1:xrate(r.c,S.base);if(!x)break;const rb=rate(S.base);
   S.entries.push({id:uid(),t:r.t,d,c:r.c,a:r.a,cat:r.cat||'anya',note:'🔁 '+(r.note||'Har mahine'),b:S.base,r:x,u:rb?x/rb:0});
   r.last=m;m=shiftM(m,1);ch=true}});
 return ch}
function cleanRecs(l){return Array.isArray(l)?l.map(r=>{if(!r||!['in','out'].includes(r.t))return null;const a=R3(num(r.a));if(!(a>0)||!/^[A-Z]{3}$/.test(r.c||''))return null;return{id:String(r.id||uid()).slice(0,40),t:r.t,a,c:r.c,cat:String(r.cat||'').slice(0,20),note:String(r.note||'').slice(0,100),day:Math.min(28,Math.max(1,+r.day||1)),from:/^\d{4}-\d{2}$/.test(r.from||'')?r.from:today().slice(0,7),last:/^\d{4}-\d{2}$/.test(r.last||'')?r.last:''}}).filter(Boolean):[]}

function udPeople(){const P={};S.entries.forEach(e=>{if(e.t!=='ud')return;const k=e.person.trim();const p=P[k]||(P[k]={name:k,bal:{},due:'',last:'',n:0});const sg=(UDK.find(x=>x[0]===e.k)||[0,0,0,1])[3];p.bal[e.c]=R3((p.bal[e.c]||0)+sg*e.a);p.n++;if(e.d>p.last)p.last=e.d;if(e.due&&(e.k==='diya'||e.k==='liya')&&(!p.due||e.due<p.due))p.due=e.due});Object.values(P).forEach(p=>{p.open=Object.values(p.bal).some(v=>Math.abs(v)>=.001)});return P}
function udOverdue(){const t=today();return Object.values(udPeople()).filter(p=>p.open&&p.due&&p.due<t).map(p=>p.name)}
function vUd(){
 const P=Object.values(udPeople()).sort((a,b)=>(b.open-a.open)||(a.last<b.last?1:-1));
 const get={},give={};P.forEach(p=>Object.entries(p.bal).forEach(([c,v])=>{if(v>=.001)get[c]=R3((get[c]||0)+v);else if(v<=-.001)give[c]=R3((give[c]||0)-v)}));
 const line=o=>Object.keys(o).length?Object.entries(o).map(([c,v])=>`<div class="big" style="font-size:16px">${esc(fmt(v,c))}</div>`).join(''):'<div class="lab">—</div>';
 let h=`<div class="grid"><div class="card"><div class="lab">Aapko milna hai</div>${line(get)}</div><div class="card"><div class="lab">Aapko dena hai</div>${line(give)}</div></div><div style="height:10px"></div><button class="btn" data-a="add" data-t="ud">🤝 Naya udhaar</button><div class="card">`;
 h+=P.length?P.map(p=>{const bs=Object.entries(p.bal).filter(([c,v])=>Math.abs(v)>=.001);const od=p.open&&p.due&&p.due<today();return `<div class="row" data-a="person" data-n="${esc(p.name)}"><div class="ico">👤</div><div class="rt"><b>${esc(p.name)}</b><small>${p.open?(p.due?'Tareekh: '+esc(dLbl(p.due)):'Khula hai'):'Hisaab saaf ✔'}</small></div><div class="ra">${bs.length?bs.map(([c,v])=>`<b class="${v>0?'in':'out'}">${v>0?'+':'-'}${esc(fmt(Math.abs(v),c))}</b>`).join(''):'<b>0</b>'}${od?'<span class="pill bad">late</span>':''}</div></div>`}).join(''):'<div class="empty">Koi udhaar darj nahi.<br>Kisko diya ya kisse liya, yahan likho.</div>';
 return h+'</div><div class="hint">Udhaar kharcha/aamdani mein nahi judta. Ye alag hisaab hai, har currency apni jagah.</div>'}

 h+=`<div class="card"><h3>Mahine ba mahine (${esc(B)})</h3><table class="tbl"><tr><th>Mahina</th><th>Aamdani</th><th>Kharcha</th><th>Bheja</th><th>Bacha</th></tr>${months.map((s,i)=>`<tr><td>${MON[i]}</td><td>${fmtN(s.inc,B)}</td><td>${fmtN(s.out,B)}</td><td>${fmtN(s.rem,B)}</td><td class="${s.inc-s.out-s.rem<0?'out':''}">${fmtN(s.inc-s.out-s.rem,B)}</td></tr>`).join('')}</table></div>`;
 h+=`<div class="hint" style="margin-bottom:10px">Har entry us waqt ke rate par jodi gayi hai, isliye purana hisaab rate badalne se nahi badalta.</div><button class="btn sec" data-a="csv">📄 Is saal ki CSV file (Excel ke liye)</button>`;

function formHtml(){
 const T=[['out','Kharcha'],['in','Aamdani'],['rem','Ghar bheja'],['ud','Udhaar']];
 let h=`<h2>${F.edit?'Entry badlo':'Nayi entry'}<button class="ib" data-a="x">✕</button></h2>`;
 if(!F.edit)h+=`<div class="seg">${T.map(x=>`<button data-a="ft" data-t="${x[0]}" class="${F.t===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>`;
 h+=`<div class="amt"><input id="fa" inputmode="decimal" placeholder="0" value="${esc(F.a)}" oninput="F.a=this.value;updRate()" autocomplete="off"><button data-a="pc" data-w="c">${esc(F.c)} ▾</button></div>`;
 h+=`<div class="chips">${S.recent.slice(0,5).map(c=>`<button class="chip ${F.c===c?'on':''}" data-a="setc" data-c="${c}">${c}</button>`).join('')}</div>`;
 if(F.c!==S.base)h+=`<label>Rate: 1 ${esc(F.c)} = ? ${esc(S.base)} <span id="rtag"></span></label><input id="fr" inputmode="decimal" placeholder="" value="${esc(F.rate)}" oninput="F.rate=this.value;updRate()"><div class="hint" id="rprev"></div>`;
 else h+=`<div class="hint" id="rprev"></div>`;
 if(F.t==='out'||F.t==='in'){const L=F.t==='in'?CATS_IN:CATS_OUT;h+=`<label>Category</label><div class="chips">${L.map(x=>`<button class="chip ${F.cat===x[0]?'on':''}" data-a="cat" data-k="${x[0]}">${x[1]} ${x[2]}</button>`).join('')}</div>`}
 if(F.t==='rem'){h+=`<label>Kisko bheja</label><input id="fto" list="dl" placeholder="Naam (optional)" value="${esc(F.to)}" oninput="F.to=this.value"><datalist id="dl">${[...new Set(S.entries.filter(e=>e.to).map(e=>e.to))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
 <label>Wahan kitne pahunche (optional, asli rate nikalne ke liye)</label><div class="amt"><input id="fra" inputmode="decimal" placeholder="0" value="${esc(F.ra)}" oninput="F.ra=this.value;updRate()" style="font-size:18px"><button data-a="pc" data-w="rc">${esc(F.rc)} ▾</button></div><div class="hint" id="eff"></div>`}
 if(F.t==='ud'){h+=`<label>Kiske saath</label><input id="fp" list="dp" placeholder="Naam" value="${esc(F.person)}" oninput="F.person=this.value"><datalist id="dp">${Object.keys(udPeople()).map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div class="chips">${UDK.map(k=>`<button class="chip ${F.k===k[0]?'on':''}" data-a="uk" data-k="${k[0]}">${k[1]} ${k[2]}</button>`).join('')}</div><label>Wapsi ki tareekh (optional)</label><input type="date" id="fdu" value="${esc(F.due)}" onchange="F.due=this.value">`}
 h+=`<label>Tareekh</label><input type="date" id="fd" value="${esc(F.d)}" onchange="F.d=this.value"><label>Note (optional)</label><input id="fn" value="${esc(F.note)}" oninput="F.note=this.value" placeholder="Jaise: Western Union / bijli bill"><div style="height:12px"></div><button class="btn" data-a="fsave">Save karo</button>${F.edit?'<div style="height:8px"></div><button class="btn dan" data-a="fdel">Hata do</button>':''}`;
 return h}
function curRate(){if(F.c===S.base)return 1;const r=num(F.rate);return r>0?r:xrate(F.c,S.base)}
function updRate(){if(!F)return;const a=num(F.a),r=curRate();const p=$('#rprev');
 if(p){p.textContent=F.c===S.base?'':(r?(a?`≈ ${fmt(a*r,S.base)}`:''):'Is currency ka rate nahi mila. Upar rate khud daalo.')}
 const tg=$('#rtag');if(tg){const am=xrate(F.c,S.base);tg.textContent=am?`(abhi ka: ${am.toFixed(4)}${rateAge()===null?', andaaza':''})`:''}
 const fr=$('#fr');if(fr)fr.placeholder=String(+xrate(F.c,S.base).toFixed(4)||'');
 const ef=$('#eff');if(ef){const ra=num(F.ra);ef.textContent=a&&ra?`Asli rate: 1 ${F.c} = ${(ra/a).toFixed(4)} ${F.rc}`+(xrate(F.c,F.rc)?` (market ≈ ${xrate(F.c,F.rc).toFixed(4)})`:''):''}}
function saveForm(){
 const a=R3(num(F.a));if(!(a>0)){toast('Rakam daalo');return}
 if(F.t==='ud'&&!F.person.trim()){toast('Naam daalo');return}
 if(!/^\d{4}-\d{2}-\d{2}$/.test(F.d)){toast('Tareekh theek karo');return}
 const r=curRate();if(!r){toast('Rate nahi mila, rate khud daalo');return}
 const rb=rate(S.base);
 const e={id:F.id||uid(),t:F.t,d:F.d,c:F.c,a,cat:(F.t==='out'||F.t==='in')?(F.cat||'anya'):'',note:F.note.trim(),b:S.base,r:F.c===S.base?1:r,u:rb?r/rb:0};
 if(F.t==='rem'){e.to=(F.to||'').trim();const ra=R3(num(F.ra));if(ra>0){e.ra=ra;e.rc=F.rc}}
 if(F.t==='ud'){e.person=F.person.trim();e.k=F.k;if(F.due&&(F.k==='diya'||F.k==='liya'))e.due=F.due}
 if(F.edit){const i=S.entries.findIndex(x=>x.id===e.id);if(i>=0)S.entries[i]=e}else S.entries.push(e);
 bumpRecent(F.c);if(F.t==='rem'&&e.rc)bumpRecent(e.rc);
 save();const mo=e.d.slice(0,7);if(mo!==UI.m&&UI.tab!=='year'&&UI.tab!=='rem'&&UI.tab!=='ud')UI.m=mo;
 closeOv();F=null;render();toast('Save ho gaya ✔')}

/* ---------- currency picker ---------- */
function pickCur(w){
 const ov=openOv(`<h2>Currency chuno<button class="ib" data-a="x">✕</button></h2><input id="cq" placeholder="Dhundo: SAR, rupee, riyal..." autocomplete="off"><div class="cl" id="cl"></div>`);
 const all=allCurs();const draw=q=>{q=q.trim().toLowerCase();let l=all.filter(c=>!q||c.toLowerCase().includes(q)||cname(c).toLowerCase().includes(q));const rec=S.recent.filter(c=>l.includes(c));l=[...rec,...l.filter(c=>!rec.includes(c))];ov.querySelector('#cl').innerHTML=l.map(c=>`<div class="row" data-a="pick" data-c="${c}" data-w="${w}"><div class="ico" style="font-size:12px;font-weight:700">${c}</div><div class="rt"><b>${esc(cname(c))}</b></div></div>`).join('')||'<div class="empty">Nahi mili</div>'};
 draw('');ov.querySelector('#cq').addEventListener('input',e=>draw(e.target.value));setTimeout(()=>ov.querySelector('#cq').focus(),50)}

 <div class="card"><h3>Currency rate</h3><div class="hint">${age===null?'Abhi andaaze wale rate hain.':'Aakhri update: '+(age<1?'abhi':age+' ghante pehle')+' ('+esc(S.fx.src)+')'}</div><div style="height:8px"></div><button class="btn sec" data-a="rr">🔄 Rate abhi update karo</button><div class="hint">Har entry mein aap apna asli rate bhi daal sakte ho (jo bank/exchange ne diya).</div></div>
 ${(()=>{const I=dataInfo();return `<div class="card"><h3>🗂️ Data ka hisaab</h3><div class="sp"><span>Kul entries</span><b>${I.n}</b></div><div class="sp"><span>Sabse purani entry</span><b>${I.old?esc(dLbl(I.old)):'—'}</b></div><div class="sp"><span>Phone mein jagah</span><b>${I.kb} KB (${I.pct}%)</b></div><div class="bar ${I.pct>70?'warn':''}"><i style="width:${Math.max(1,I.pct)}%"></i></div><div class="hint">App aapka data 5 saal ya usse zyada bhi sambhal kar rakhta hai. Kuch bhi khud se nahi hatata. Udhaar ki entries kabhi nahi hatayi jaatin, kyunke unse len-den ka hisaab banta hai.</div>${I.prune.length?`<div style="height:8px"></div><button class="btn sec" data-a="pruneold">🧹 ${I.prune.length} entries hatao (5 saal se purani)</button>`:'<div class="hint" style="margin-top:6px">✔ Koi entry 5 saal se purani nahi.</div>'}</div>`})()}
 <div class="card"><h3>🔒 App lock</h3><div class="hint" style="margin:0 0 8px">${getLock()?'Lock chalu hai. App 30 second background mein rahe to dobara PIN maangega.':'PIN lagao taake koi aur aapka hisaab na khol sake.'}</div><button class="btn sec" data-a="lkset">${getLock()?'PIN badlo / lock hatao':'PIN lagao'}</button></div>
 <div class="card"><h3>Backup (zaroor lo)</h3><div class="hint">Data sirf aapke phone mein hai. Phone badla ya browser ka data mita to backup ke bina sab chala jaayega.${S.lastBackup?'<br>Aakhri backup: '+new Date(S.lastBackup).toLocaleDateString():''}</div><div style="height:8px"></div><button class="btn" data-a="bk">💾 Backup lo (file)</button><div style="height:8px"></div><button class="btn sec" data-a="bks">📤 WhatsApp / kisi ko bhejo</button><div style="height:8px"></div><button class="btn sec" data-a="imp">📥 Backup wapas lo</button><input type="file" id="impf" accept=".json,application/json" hidden></div>
 <div class="card"><h3>Khatarnak</h3><button class="btn dan" data-a="wipe">Saara data mita do</button></div>
 <div class="hint" style="text-align:center">Mera Hisaab · aapka data kisi server par nahi jaata.</div>`)}
function backupObj(){return{app:'mera-hisaab',v:1,at:Date.now(),data:{base:S.base,recent:S.recent,entries:S.entries,budget:S.budget,cb:S.cb,rec:S.rec,goal:S.goal}}}
function download(name,type,txt){const b=new Blob([txt],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},1500)}
const bkName=()=>'hisaab-backup-'+curAcct().name.replace(/[^\w\u0600-\u06FF]+/g,'-').slice(0,20)+'-'+today()+'.json';
function doBackup(){download(bkName(),'application/json',JSON.stringify(backupObj()));S.lastBackup=Date.now();save();toast('Backup file download ho gayi')}
async function shareBackup(){const f=new File([JSON.stringify(backupObj())],bkName(),{type:'application/json'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Hisaab backup'});S.lastBackup=Date.now();save();return}}catch(e){if(e&&e.name==='AbortError')return}doBackup()}
function cleanEntry(e){if(!e||typeof e!=='object')return null;const t=['in','out','rem','ud'].includes(e.t)?e.t:null;const a=R3(num(e.a));if(!t||!(a>0)||!/^\d{4}-\d{2}-\d{2}$/.test(e.d||'')||!/^[A-Z]{3}$/.test(e.c||''))return null;
 const o={id:String(e.id||uid()).slice(0,40),t,d:e.d,c:e.c,a,cat:String(e.cat||'').slice(0,20),note:String(e.note||'').slice(0,200),b:/^[A-Z]{3}$/.test(e.b||'')?e.b:S.base,r:+e.r>0?+e.r:0,u:+e.u>0?+e.u:0};
 if(t==='rem'){o.to=String(e.to||'').slice(0,60);if(+e.ra>0&&/^[A-Z]{3}$/.test(e.rc||'')){o.ra=R3(+e.ra);o.rc=e.rc}}
 if(t==='ud'){o.person=String(e.person||'?').slice(0,60);o.k=UDK.some(k=>k[0]===e.k)?e.k:'diya';if(/^\d{4}-\d{2}-\d{2}$/.test(e.due||''))o.due=e.due}
 return o}
function importFile(file){const rd=new FileReader();rd.onload=()=>{let j;try{j=JSON.parse(rd.result)}catch(e){toast('File theek nahi hai');return}
 const d=j&&j.data;if(!j||j.app!=='mera-hisaab'||!d||!Array.isArray(d.entries)){toast('Ye Hisaab ki backup file nahi hai');return}
 const ents=d.entries.map(cleanEntry).filter(Boolean);
 const ov=openOv(`<h2>${ents.length} entries mili<button class="ib" data-a="x">✕</button></h2><div class="hint">Merge: purani entries rahengi, nayi judengi. Badal do: abhi ka sab data hat kar file wala aayega.</div><div style="height:10px"></div><button class="btn" id="im1">Milao (merge)</button><div style="height:8px"></div><button class="btn dan" id="im2">Badal do (replace)</button>`);
 ov.querySelector('#im1').onclick=()=>{const ids=new Set(S.entries.map(e=>e.id));ents.forEach(e=>{if(!ids.has(e.id))S.entries.push(e)});save();closeAll();render();toast('Merge ho gaya ✔')};
 ov.querySelector('#im2').onclick=()=>{S.entries=ents;if(/^[A-Z]{3}$/.test(d.base||''))S.base=d.base;if(Array.isArray(d.recent))S.recent=d.recent.filter(c=>/^[A-Z]{3}$/.test(c)).slice(0,8);S.budget=+d.budget||0;S.goal=+d.goal||0;S.rec=cleanRecs(d.rec);S.cb={};if(d.cb&&typeof d.cb==='object')CATS_OUT.forEach(c=>{const v=+d.cb[c[0]];if(v>0)S.cb[c[0]]=v});save();closeAll();render();toast('Data wapas aa gaya ✔')}};rd.readAsText(file)}
function closeAll(){$('#ovs').innerHTML='';if(pendingReload)location.reload()}
function csv(){const y=String(UI.y);const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const rows=[['date','type','category','amount','currency','rate_to_'+S.base,'amount_in_'+S.base,'person_or_recipient','received_amount','received_currency','note']];
 sorted().filter(e=>e.d.startsWith(y)).reverse().forEach(e=>rows.push([e.d,{in:'income',out:'expense',rem:'remittance',ud:'udhaar:'+e.k}[e.t],e.cat,e.a,e.c,e.b===S.base?e.r:'',R3(bv(e)),e.person||e.to||'',e.ra||'',e.rc||'',e.note]));
 download('hisaab-'+y+'.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'))}

 sbg(){S.budget=Math.max(0,num($('#sb').value));S.goal=Math.max(0,num($('#sg').value));S.cb={};document.querySelectorAll('.cbi').forEach(i=>{const v=Math.max(0,num(i.value));if(v>0)S.cb[i.dataset.k]=v});save();closeOv();render();toast('Save ✔')},
 pruneold(){const I=dataInfo();if(!I.prune.length)return;

  const ids=new Set(I.prune.map(e=>e.id));S.entries=S.entries.filter(e=>!ids.has(e.id));save();closeOv();render();openSettings();toast(I.prune.length+' purani entries hata di ✔')},

 sm(el){UI.m=el.dataset.m;render()},
 lkset(){openLockForm()},
 async lksave(){const o=topOv(),L=getLock();

  localStorage.setItem(LK,JSON.stringify({s:sl,n:p.length,h:await hashPin(p,sl)}));localStorage.removeItem(LF);
  closeOv();closeOv();openSettings();toast('Lock lag gaya ✔')},

  if(await hashPin(o.querySelector('#lkc').value||'',L.s)!==L.h){toast('Abhi ka PIN galat hai');return}
  localStorage.removeItem(LK);localStorage.removeItem(LF);closeOv();closeOv();openSettings();toast('Lock hata diya')},
 recn(){openRec()},
 rece(el){openRec(el.dataset.id)},
 recs(el){const o=topOv(),id=el.dataset.id;const a=R3(num(o.querySelector('#ra').value));if(!(a>0)){toast('Rakam daalo');return}
  const day=Math.min(28,Math.max(1,Math.round(num(o.querySelector('#rd').value))||1));
  const r0=id?(S.rec||[]).find(x=>x.id===id):null;const c=o.querySelector('#rc').value;
  const r={id:id||uid(),t:o.querySelector('#rt').value,a,c,cat:o.querySelector('#rcat').value,note:o.querySelector('#rn').value.trim().slice(0,100),day,from:'',last:''};
  if(r0){r.from=r0.from;r.last=r0.last}else{const td=today();r.from=+td.slice(8)<=day?td.slice(0,7):shiftM(td.slice(0,7),1)}
  S.rec=S.rec||[];if(r0)S.rec[S.rec.indexOf(r0)]=r;else S.rec.push(r);
  bumpRecent(c);processRec();save();closeOv();closeOv();render();openSettings();toast('Save ✔')},
 recd(el){if(confirm('Ye recurring hata dein? (purani entries rahengi)')){S.rec=(S.rec||[]).filter(x=>x.id!==el.dataset.id);save();closeOv();closeOv();render();openSettings()}},
 rr(el){if(el&&el.tagName==='A')event.preventDefault();toast('Rate la raha hoon…');refreshRates(true)},

/* ---------- app lock ---------- */
const LK=kL(AC.cur),LF=kF(AC.cur);
const getLock=()=>{try{const j=JSON.parse(localStorage.getItem(LK));return j&&j.h&&j.s?j:null}catch(e){return null}};
const lockFail=()=>{try{return JSON.parse(localStorage.getItem(LF))||{}}catch(e){return{}}};
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function hashPin(pin,salt){
 try{if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256);return b64(bits)}}catch(e){}
 let h=5381;const t=salt+pin;for(let i=0;i<t.length*50;i++){h=((h<<5)+h+t.charCodeAt(i%t.length))|0}return 'f'+h}
let locked=false,hidAt=0;
function showLock(){const L=getLock();if(!L||locked)return;locked=true;let v='',busy=false;
 const o=document.createElement('div');o.className='lock';
 const draw=m=>{o.innerHTML=`<img src="hisaab-192.png" alt="" style="width:84px;height:84px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.3)"><h2 style="margin:8px 0 2px">${esc(curAcct().name)}</h2><div class="hint">${m||'PIN daalo'}</div><div class="dots">${Array.from({length:L.n},(_,i)=>`<i class="${i<v.length?'on':''}"></i>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div><a href="#" id="lkf" class="hint" style="margin-top:22px;color:var(--mu)">PIN bhool gaye?</a>`};
 draw();
 o.onclick=async e=>{
  if(e.target.id==='lkf'){e.preventDefault();if(confirm('PIN bhool gaye to sirf data mita kar reset ho sakta hai (backup file ho to baad mein wapas la sakte ho). Aage badhein?')&&confirm('Pakka? Saara hisaab mit jaayega.')){localStorage.removeItem(LS);localStorage.removeItem(LK);localStorage.removeItem(LF);location.reload()}return}
  const k=e.target.closest('button[data-k]');if(!k||busy)return;
  const f=lockFail();if(f.until>Date.now()){draw('Thodi der baad koshish karo ('+Math.ceil((f.until-Date.now())/1000)+' sec)');return}
  const d=k.dataset.k;if(d==='⌫')v=v.slice(0,-1);else if(v.length<L.n)v+=d;
  draw();
  if(v.length===L.n){busy=true;const h=await hashPin(v,L.s);busy=false;
   if(h===L.h){localStorage.removeItem(LF);o.remove();locked=false}
   else{const n=(f.n||0)+1;localStorage.setItem(LF,JSON.stringify({n,until:n>=5?Date.now()+30000*Math.min(n-4,10):0}));v='';draw(n>=5?'Bahut galat koshish. Thodi der ruko.':'Galat PIN');if(navigator.vibrate)navigator.vibrate(200)}}};
 document.body.appendChild(o)}

 navigator.serviceWorker.register('sw.js').then(reg=>{document.addEventListener('visibilitychange',()=>{if(!document.hidden){reg.update().catch(()=>{});if(!S.fx.t||Date.now()-S.fx.t>12*36e5)refreshRates(false)}})}).catch(()=>{});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||window.__rl)return;window.__rl=1;if($('#ovs').children.length)pendingReload=true;else location.reload()})}
